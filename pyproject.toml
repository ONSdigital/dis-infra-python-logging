[tool.poetry]
name = "dis-logging"
version = "1.0.2"
description = "ONS Dissemination JSON log formatter for Python Lambda functions"
authors = ["ONS Digital"]
readme = "README.md"
license = "MIT"
packages = [{include = "dis_logging", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
json-log-formatter = "^1.1.1"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
black = "^26.5.1"
isort = "^8.0.1"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.14.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 120
